plugins { id 'com.android.application' }

// Release signing key, for the APKs that are published. Its settings are read from keystore.properties in the
// project, or else from factor-assist-keystore.properties in the user's home folder - kept there, outside every
// copy of the project, the published copy built on this PC is signed too, with nothing to copy in and delete
// after. Neither the settings nor the key are ever in the repository; without them the release build falls back
// to the debug key, which is fine for testing on this PC but must never be distributed.
def signing = new Properties()
def signingFile = [rootProject.file('keystore.properties'),
                   new File(System.getProperty('user.home'), 'factor-assist-keystore.properties')].find { it.exists() }
if (signingFile != null) signingFile.withInputStream { signing.load(it) }

android {
    signingConfigs {
        if (signing['storeFile']) {
            publish {
                storeFile file(signing['storeFile']); storePassword signing['storePassword']
                keyAlias signing['keyAlias']; keyPassword signing['keyPassword']
            }
        }
    }
    namespace 'jp.factor.overlay'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.factor.overlay'; minSdk 34; targetSdk 35; versionCode 9; versionName '0.5.1'
        // Only 64-bit ARM: x86/x86_64 are for emulators, and minSdk 34 leaves no 32-bit ARM devices.
        // ONNX Runtime and ML Kit ship all four, which would be three quarters of the APK.
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.all {
        systemProperty 'factor.assets', file('src/main/assets').absolutePath
        // -PtestJava=<java.exe> runs the unit tests on another Java. Android Studio's own ships an older msvcp140.dll,
        // which ONNX Runtime 1.23 fails to initialise with, so the tests that run the models need one without it.
        if (project.hasProperty('testJava')) executable = project.property('testJava')
    } }
    // Release = the optimised build: a debuggable APK runs the Java image preprocessing several times slower.
    // No shrinking, since ONNX Runtime and ML Kit are reached through JNI/reflection.
    buildTypes {
        release {
            signingConfig signing['storeFile'] ? signingConfigs.publish : signingConfigs.debug
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
