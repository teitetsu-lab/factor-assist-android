plugins { id 'com.android.application' }
android {
    namespace 'jp.factor.overlay'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.factor.overlay'; minSdk 34; targetSdk 35; versionCode 5; versionName '0.2.2'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.all { systemProperty 'factor.assets', file('src/main/assets').absolutePath } }
    // Release = the optimised build: a debuggable APK runs the Java image preprocessing several times slower.
    // Signed with this PC's debug key so it installs over the debug build and keeps presets; no shrinking,
    // since ONNX Runtime and ML Kit are reached through JNI/reflection.
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
